[package]
name = "openbazaar-xmr"
description = "Direct Monero payments for OpenBazaar: view-key scanning, per-order subaddresses, and one-recipient sends through a monerod the user chooses."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-memory chain for offline tests of the node.
mock = []

[dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize", "precomputed-tables"] }
hex = "0.4"
hmac = "0.12"
monero-daemon-rpc = "0.2.0"
monero-wallet = "0.2.0"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net"] }
zeroize = "1.8"

[dev-dependencies]
openbazaar-xmr = { path = ".", features = ["mock"] }
