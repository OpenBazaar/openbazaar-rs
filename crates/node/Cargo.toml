[package]
name = "ob-node"
description = "Local fixture catalog for the OpenBazaar client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ob_node"
path = "src/lib.rs"

[[bin]]
name = "ob-node"
path = "src/main.rs"

[dependencies]
bitcoin = "0.32.7"
chacha20poly1305 = "0.10"
openbazaar-escrow = { path = "../escrow" }
openbazaar-pay = { path = "../pay" }
openbazaar-protocol = { path = "../protocol" }
rand = "0.9"
serde_json = "1"
tormail = { path = "../tormail" }
ureq = "2.12"
