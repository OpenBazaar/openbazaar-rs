[package]
name = "ob-node"
description = "Local fixture catalog for the OpenBazaar client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ob_node"
path = "src/lib.rs"

[[bin]]
name = "ob-node"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
arti-client = { version = "0.48", features = ["onion-service-client", "onion-service-service", "static-sqlite"] }
bip157 = "0.8.1"
bdk_esplora = { version = "0.22.3", default-features = false, features = ["std", "async-https-rustls", "tokio"] }
bdk_wallet = { version = "3.2.0", features = ["keys-bip39"] }
bitcoin = "0.32.7"
chacha20poly1305 = "0.10"
musig2 = "0.4.1"
openbazaar-escrow = { path = "../escrow" }
openbazaar-pay = { path = "../pay" }
openbazaar-protocol = { path = "../protocol" }
openbazaar-xmr = { path = "../xmr" }
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
rpassword = "7.4"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "net"] }
tor-rtcompat = "0.48"
tormail = { path = "../tormail" }
ureq = { version = "2.12", features = ["socks-proxy"] }
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
openbazaar-xmr = { path = "../xmr", features = ["mock"] }
proptest = "1"
