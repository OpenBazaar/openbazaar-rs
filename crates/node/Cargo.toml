[package]
name = "ob-node"
description = "Local fixture catalog for the OpenBazaar client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ob_node"
path = "src/lib.rs"

[[bin]]
name = "ob-node"
path = "src/main.rs"

# The desktop shell already static-links the CRT; the bundled ob-node sidecar
# did not, so a clean Windows install without the VC++ redistributable failed
# to load VCRUNTIME140.dll. build.rs calls metabuild only for windows-msvc.
[build-dependencies]
static_vcruntime = "2"

[dependencies]
argon2 = "0.5"
# default-features off so we do not pull native-tls → OpenSSL. That would make
# Linux releases need libssl.so.3 (missing from the .deb Depends today, and from
# many minimal/hardened templates). rustls matches crates/mobile-tor.
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service", "static-sqlite", "experimental-api", "keymgr", "restricted-discovery"] }
# Arti's directory client pulls liblzma through async-compression. Without the
# static feature, a macOS build on a Homebrew runner links
# /opt/homebrew/opt/xz/lib/liblzma.5.dylib and the shipped app aborts on
# machines that do not have that path (SIGABRT at startup).
liblzma = { version = "0.4", features = ["static"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
bip157 = "0.8.1"
bip39 = "2.2"
bdk_esplora = { version = "0.22.3", default-features = false, features = ["std", "async-https-rustls", "tokio"] }
bdk_wallet = { version = "3.2.0", features = ["keys-bip39"] }
bitcoin = "0.32.7"
chacha20poly1305 = "0.10"
data-encoding = "2"
futures = "0.3"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
if-addrs = "0.13"
mdns-sd = "0.21"
musig2 = "0.4.1"
p256 = { version = "0.13", features = ["ecdsa"] }
openbazaar-escrow = { path = "../escrow" }
openbazaar-lightning = { path = "../lightning" }
openbazaar-pay = { path = "../pay" }
openbazaar-protocol = { path = "../protocol" }
openbazaar-xmr = { path = "../xmr" }
openbazaar-zec = { path = "../zec" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
rpassword = "7.4"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"] }
tormail = { path = "../tormail" }
tracing = "0.1"
ureq = { version = "2.12", features = ["socks-proxy"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
openbazaar-lightning = { path = "../lightning", features = ["mock", "regtest"] }
tempfile = "3"
openbazaar-xmr = { path = "../xmr", features = ["mock"] }
openbazaar-zec = { path = "../zec", features = ["mock"] }
proptest = "1"
tormail = { path = "../tormail" }
