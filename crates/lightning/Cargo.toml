[package]
name = "openbazaar-lightning"
description = "Direct Lightning payments for OpenBazaar: an embedded LDK node with an LSP for inbound liquidity, keys from the wallet seed, channel state encrypted with a key from that seed."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-memory Lightning node for offline tests of ob-node.
mock = []
# A local bitcoind and LSP for tests with real LDK nodes (src/regtest.rs).
regtest = ["dep:serde_json", "dep:tempfile"]

[dependencies]
chacha20poly1305 = "0.10"
hex = "0.4"
hmac = "0.12"
ldk-node = "0.7.1"
lightning-persister = "0.2"
rand = "0.9"
serde_json = { version = "1", optional = true }
sha2 = "0.10"
tempfile = { version = "3", optional = true }
zeroize = "1.8"

[dev-dependencies]
openbazaar-lightning = { path = ".", features = ["mock", "regtest"] }
tempfile = "3"
