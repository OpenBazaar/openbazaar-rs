[package]
name = "openbazaar-zec"
description = "Direct Zcash payments for OpenBazaar: a ZIP 32 key from the wallet phrase, a fresh Orchard address per order, compact-block scanning, and Ironwood spends."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-memory chain of compact blocks for offline tests of the node, and a
# small gRPC server standing in for Zaino that serves it.
mock = ["dep:rand", "dep:bytes", "dep:http-body-util", "dep:hyper", "dep:prost"]

[dependencies]
bytes = { version = "1", optional = true }
hex = "0.4"
http = "1"
incrementalmerkletree = { version = "0.9", default-features = false, features = ["legacy-api"] }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http2"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# `circuit` comes in through `zcash_primitives`' proving feature, for Ironwood spends.
orchard = { version = "0.16", default-features = false, features = ["std", "zeroize"] }
prost = { version = "0.14", optional = true }
rand = { version = "0.9", optional = true }
# rand 0.10 matches librustzcash's `Rng` (0.9 does not). The mock chain stays on 0.9.
rand10 = { package = "rand", version = "0.10", default-features = false, features = ["sys_rng"] }
rand_core = "0.10"
sapling-crypto = { version = "0.9", default-features = false, features = ["circuit"] }
serde_json = "1"
bls12_381 = { version = "0.9", default-features = false, features = ["alloc"] }
jubjub = { version = "0.11", default-features = false, features = ["alloc"] }
subtle = { version = "2.6", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
# TLS for https indexers, with ring like the rest of the node: no aws-lc.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
webpki-roots = "1"
# Without `tor` (a second Arti) and without `zcash_client_sqlite` (a second libsqlite3-sys).
zcash_address = "0.14"
zcash_client_backend = { version = "0.25", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-transport"] }
zcash_keys = { version = "0.17", default-features = false, features = ["std", "orchard", "zeroize"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = { version = "0.31", default-features = false, features = ["std", "circuits"] }
zcash_protocol = "0.11"
zcash_transparent = { version = "0.11", default-features = false, features = ["std"] }
zip32 = { version = "0.3", default-features = false }
zip321 = "0.10"
zeroize = "1.8"

[dev-dependencies]
openbazaar-zec = { path = ".", features = ["mock"] }
