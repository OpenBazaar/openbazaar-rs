[package]
name = "openbazaar-zec"
description = "Direct Zcash payments for OpenBazaar: a ZIP 32 viewing key from the wallet phrase, a fresh Orchard address per order, and compact-block scanning that finds payments in the Orchard and Ironwood pools."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-memory chain of compact blocks for offline tests of the node, and a
# small gRPC server standing in for Zaino that serves it.
mock = ["dep:rand", "dep:bytes", "dep:http-body-util", "dep:hyper", "dep:prost"]

[dependencies]
bytes = { version = "1", optional = true }
hex = "0.4"
http = "1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http2"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# No proving in this crate yet, so no circuit.
orchard = { version = "0.16", default-features = false, features = ["std", "zeroize"] }
prost = { version = "0.14", optional = true }
rand = { version = "0.9", optional = true }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
# TLS for https indexers, with ring like the rest of the node: no aws-lc.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
webpki-roots = "1"
# Without `tor` (a second Arti) and without `zcash_client_sqlite` (a second libsqlite3-sys).
zcash_address = "0.14"
zcash_client_backend = { version = "0.25", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-transport"] }
zcash_keys = { version = "0.17", default-features = false, features = ["std", "orchard", "zeroize"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = { version = "0.31", default-features = false }
zcash_protocol = "0.11"
zip32 = { version = "0.3", default-features = false }
zip321 = "0.10"
zeroize = "1.8"

[dev-dependencies]
openbazaar-zec = { path = ".", features = ["mock"] }
