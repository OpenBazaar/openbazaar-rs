[package]
name = "openbazaar-escrow"
description = "Scriptless moderated escrow for OpenBazaar"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[features]
# Single-process `fund` shim that holds both keys. Only the node demo enables
# it; remove it when the node moves to the two-party API.
legacy-single-process = []

[dependencies]
bitcoin = "0.32.7"
musig2 = { version = "0.4.1", features = ["rand"] }
openbazaar-protocol = { path = "../protocol" }
rand = "0.9"
secp256k1 = "0.31"
