[package]
name = "tormail"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Sealed OpenBazaar order letters carried to a vendor onion mailbox"

[dependencies]
arti-client = { version = "0.48", features = ["onion-service-client", "onion-service-service", "static-sqlite"] }
async-trait = "0.1"
bitcoin = "0.32.7"
futures = "0.3"
hpke = { version = "0.13", default-features = false, features = ["std", "x25519"] }
rand = "0.9"
safelog = "0.10"
thiserror = "2"
tor-cell = "0.48"
tor-hscrypto = "0.48"
tor-hsservice = "0.48"
tor-proto = { version = "0.48", features = ["hs-service"] }
tor-rtcompat = "0.48"
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
