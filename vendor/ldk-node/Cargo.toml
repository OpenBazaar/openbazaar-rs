# ldk-node 0.7.1 from crates.io, vendored by OpenBazaar. Two changes:
# rusqlite is widened to ">=0.31.0, <0.40.0" so it shares libsqlite3-sys with
# Arti, and src/io/sqlite_store sets user_version with `pragma_update`
# (rusqlite 0.37 dropped `DatabaseName`); public peer, Esplora, and Rapid
# Gossip Sync dials go through Config::socks_proxy (socks5h) instead of a
# clearnet TCP connect. Tests, benches, and bindings are left out. Drop this
# copy once a release carries both.
#
# THIS FILE WAS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2021"
rust-version = "1.85"
name = "ldk-node"
version = "0.7.1"
authors = ["Elias Rohrer <dev@tnull.de>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A ready-to-go node implementation built using LDK."
homepage = "https://lightningdevkit.org/"
readme = "README.md"
keywords = [
    "bitcoin",
    "lightning",
    "ldk",
    "bdk",
]
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lightningdevkit/ldk-node/"

[features]
default = []

[lib]
name = "ldk_node"
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies.base64]
version = "0.22.1"
features = ["std"]
default-features = false

[dependencies.bdk_chain]
version = "0.23.0"
features = ["std"]
default-features = false

[dependencies.bdk_electrum]
version = "0.23.0"
features = ["use-rustls-ring"]
default-features = false

[dependencies.bdk_esplora]
version = "0.22.0"
features = [
    "async-https-rustls",
    "tokio",
]
default-features = false

[dependencies.bdk_wallet]
version = "2.2.0"
features = [
    "std",
    "keys-bip39",
]
default-features = false

[dependencies.bip21]
version = "0.5"
features = ["std"]
default-features = false

[dependencies.bip39]
version = "2.0.0"
features = ["rand"]

[dependencies.bitcoin]
version = "0.32.7"

[dependencies.chrono]
version = "0.4"
features = ["clock"]
default-features = false

[dependencies.electrum-client]
version = "0.24.0"
features = [
    "proxy",
    "use-rustls-ring",
]
default-features = false

[dependencies.esplora-client]
version = "0.12"
features = [
    "tokio",
    "async-https-rustls",
]
default-features = false

[dependencies.libc]
version = "0.2"

[dependencies.lightning]
version = "0.2.0"
features = ["std"]

[dependencies.lightning-background-processor]
version = "0.2.0"

[dependencies.lightning-block-sync]
version = "0.2.0"
features = [
    "rest-client",
    "rpc-client",
    "tokio",
]

[dependencies.lightning-invoice]
version = "0.34.0"
features = ["std"]

[dependencies.lightning-liquidity]
version = "0.2.0"
features = ["std"]

[dependencies.lightning-macros]
version = "0.2.0"

[dependencies.lightning-net-tokio]
version = "0.2.0"

[dependencies.lightning-persister]
version = "0.2.0"
features = ["tokio"]

[dependencies.lightning-rapid-gossip-sync]
version = "0.2.0"

[dependencies.lightning-transaction-sync]
version = "0.2.0"
features = [
    "esplora-async-https",
    "time",
    "electrum-rustls-ring",
]

[dependencies.lightning-types]
version = "0.3.0"

[dependencies.log]
version = "0.4.22"
features = ["std"]
default-features = false

[dependencies.prost]
version = "0.11.6"
default-features = false

[dependencies.rand]
version = "0.9.2"
features = [
    "std",
    "thread_rng",
    "os_rng",
]
default-features = false

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "rustls-tls",
    "socks",
]
default-features = false

[dependencies.rusqlite]
version = ">=0.31.0, <0.40.0"
features = ["bundled"]

[dependencies.rustls]
version = "0.23"
default-features = false

[dependencies.serde]
version = "1.0.210"
features = [
    "std",
    "derive",
]
default-features = false

[dependencies.serde_json]
version = "1.0.128"
features = ["std"]
default-features = false

[dependencies.tokio]
version = "1.37"
features = [
    "rt-multi-thread",
    "time",
    "sync",
    "macros",
]
default-features = false

[dependencies.uniffi]
version = "0.28.3"
features = ["build"]
optional = true

[dependencies.vss-client]
version = "0.4"
package = "vss-client-ng"

[build-dependencies.uniffi]
version = "0.28.3"
features = ["build"]
optional = true

[target."cfg(windows)".dependencies.winapi]
version = "0.3"
features = ["winbase"]

[lints.rust.unexpected_cfgs]
level = "forbid"
priority = 0
check-cfg = [
    "cfg(vss_test)",
    "cfg(ldk_bench)",
    "cfg(tokio_unstable)",
    "cfg(cln_test)",
    "cfg(lnd_test)",
]

