name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    name: version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/version.mjs check
      - run: node --test scripts/version.test.mjs

  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Lightning regtest tests pass without running when there is no
      # bitcoind, so one goes on PATH: the official Bitcoin Core build, checked
      # against the hash in the SHA256SUMS file published beside it (also in
      # bitcoin-core/guix.sigs). Cached so a mirror outage only hurts a miss.
      - id: bitcoind-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bitcoin-31.0
          key: bitcoind-31.0-${{ runner.os }}-${{ runner.arch }}
      - name: install bitcoind
        if: steps.bitcoind-cache.outputs.cache-hit != 'true'
        env:
          BITCOIN_CORE: "31.0"
          SHA256: d3e4c58a35b1d0a97a457462c94f55501ad167c660c245cb1ffa565641c65074
        run: |
          cd "$RUNNER_TEMP"
          tarball="bitcoin-$BITCOIN_CORE-x86_64-linux-gnu.tar.gz"
          for host in https://bitcoincore.org https://bitcoin.org; do
            curl -fsSL --retry 3 -o "$tarball" "$host/bin/bitcoin-core-$BITCOIN_CORE/$tarball" && break
          done
          echo "$SHA256  $tarball" | sha256sum --check
          tar -xzf "$tarball"
      - run: echo "$RUNNER_TEMP/bitcoin-31.0/bin" >> "$GITHUB_PATH"
      # Without a bitcoind the job stops here, before those tests can skip.
      - run: bitcoind --version
      # The lockfile pins crates. Do not pass --ignored: the live Arti dial
      # stays ignored when that test is on the branch. Crates are not vendored,
      # so the runner fetches the locked versions instead of using --offline.
      - run: cargo test --locked

  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/mobile/dist
          retention-days: 3

  node-bin:
    name: build ob-node for browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ob-node-bin
      - run: cargo build -p ob-node --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ob-node
          path: target/debug/ob-node
          retention-days: 3

  ui-real:
    name: browser tests against real nodes
    needs: [web, node-bin]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      OB_NODE_BIN: ${{ github.workspace }}/bin/ob-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ob-node
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/mobile/dist
      - run: chmod +x "$OB_NODE_BIN"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.real.config.ts --project=real
      - run: npx playwright test -c playwright.real.config.ts --project=crawl selftest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-real-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          retention-days: 7

  ui-mocked:
    name: browser tests with node answers intercepted
    needs: [web, node-bin]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    env:
      OB_NODE_BIN: ${{ github.workspace }}/bin/ob-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ob-node
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/mobile/dist
      - run: chmod +x "$OB_NODE_BIN"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-mocked-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          retention-days: 7
