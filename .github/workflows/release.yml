name: release

# Builds the desktop app with the bundled ob-node for macOS (universal),
# Linux (AppImage, deb), and Windows (NSIS); the home node (ob-node with the
# web shop) for Linux x86_64 and arm64 and macOS, and its Docker image for
# linux/amd64 and linux/arm64; then writes SHA256SUMS. The image is pushed to
# ghcr.io/<owner>/ob-node only when the release is published.
#
# A v* tag publishes a GitHub Release. A manual run builds from any branch and
# keeps the installers as workflow artifacts; it publishes only when `publish`
# is checked, tagging v<version> at the built commit. A version with a
# pre-release part (0.1.0-alpha.1) is published as a prerelease.
#
# The version comes from the run's input or tag. scripts/version.mjs writes it
# to every file that carries it (Cargo.toml is the source of truth) and checks
# they agree; the built ob-node must then report it. Builds are stamped with
# the commit and kind: "release" for a tag or a published run, "ci" otherwise.
#
# Unsigned builds need no secrets. Signing runs only when these repository
# secrets exist:
#
#   macOS code signing (Developer ID Application certificate):
#     APPLE_CERTIFICATE            base64 of the exported .p12
#     APPLE_CERTIFICATE_PASSWORD   password of that .p12
#     APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   macOS notarization (needs signing as well):
#     APPLE_ID                     Apple ID email
#     APPLE_PASSWORD               app-specific password for that Apple ID
#     APPLE_TEAM_ID                10-character team ID
#   Windows Authenticode:
#     WINDOWS_CERTIFICATE          base64 of the code-signing .pfx
#     WINDOWS_CERTIFICATE_PASSWORD password of that .pfx

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (semver, e.g. 0.1.0-alpha.1)"
        required: true
        default: "0.1.0-dev"
      publish:
        description: "Publish a GitHub Release tagged v<version> at this commit"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  # Arti pulls liblzma. Homebrew runners have xz, and without this the macOS
  # binary links /opt/homebrew/opt/xz/lib/liblzma.5.dylib and aborts on user
  # machines that lack it. crates/node also enables liblzma/static; this env
  # covers any crate path that does not.
  LZMA_API_STATIC: "1"

jobs:
  verify:
    name: test before packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: node scripts/version.mjs check
      - run: node --test scripts/version.test.mjs
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile

  ui-gate:
    name: browser tests and a short crawl on real nodes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    env:
      OB_CRAWL_MINUTES: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ob-node-bin
      - run: cargo build -p ob-node --locked
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.real.config.ts --project=real --project=crawl
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
          retention-days: 14

  desktop:
    name: tauri (${{ matrix.name }})
    needs: [verify, ui-gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OB_BUILD_KIND: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'release' || 'ci' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          # 22.04 keeps the AppImage and deb on an older glibc than 24.04.
          - name: linux-x64
            os: ubuntu-22.04
            target: ""
            rust-targets: ""
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            target: ""
            rust-targets: ""
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - run: npm ci
        working-directory: apps/mobile
      - run: npm ci
        working-directory: apps/desktop
      # Record whether the checkout was clean before the version is stamped,
      # so the stamp itself does not mark the build dirty.
      - name: set the installer version
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then dirty=true; else dirty=false; fi
          echo "OB_BUILD_DIRTY=${dirty}" >> "$GITHUB_ENV"
          node scripts/version.mjs set "$version"
          node scripts/version.mjs check
          if [ "$(node scripts/version.mjs get)" != "$version" ]; then
            echo "The version files say $(node scripts/version.mjs get), not ${version}." >&2
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"

      # Tauri signs when APPLE_CERTIFICATE is set and notarizes when APPLE_ID,
      # APPLE_PASSWORD, and APPLE_TEAM_ID are set. An empty variable still
      # counts as set, so each one is exported only when its secret exists.
      # Without them the app keeps the ad-hoc signature from tauri.conf.json.
      - name: configure macOS signing (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export_env() {
            local delimiter="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >> "$GITHUB_ENV"
          }
          if [ -n "$S_APPLE_CERTIFICATE" ] && [ -n "$S_APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$S_APPLE_SIGNING_IDENTITY" ]; then
            export_env APPLE_CERTIFICATE "$S_APPLE_CERTIFICATE"
            export_env APPLE_CERTIFICATE_PASSWORD "$S_APPLE_CERTIFICATE_PASSWORD"
            export_env APPLE_SIGNING_IDENTITY "$S_APPLE_SIGNING_IDENTITY"
            echo "macOS: signing with the Developer ID certificate."
            if [ -n "$S_APPLE_ID" ] && [ -n "$S_APPLE_PASSWORD" ] && [ -n "$S_APPLE_TEAM_ID" ]; then
              export_env APPLE_ID "$S_APPLE_ID"
              export_env APPLE_PASSWORD "$S_APPLE_PASSWORD"
              export_env APPLE_TEAM_ID "$S_APPLE_TEAM_ID"
              echo "macOS: notarizing."
            else
              echo "macOS: notarization secrets missing; the app is signed but not notarized."
            fi
          else
            echo "macOS: signing secrets missing; the app is ad-hoc signed."
          fi

      - name: configure Windows signing (optional)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          S_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          S_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:S_WINDOWS_CERTIFICATE -or -not $env:S_WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Output "Windows: signing secrets missing; the installer is unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:S_WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:S_WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $confPath = "apps/desktop/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $windows = [pscustomobject]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          }
          $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue $windows -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding utf8
          Write-Output "Windows: signing with certificate $($cert.Thumbprint)."

      # In-app updates (docs/updates.md). With the key, Tauri also writes each
      # installer's update bundle and its minisign signature, and the app reads
      # the manifest of this version's channel. Without it the release builds
      # as before and the app never checks.
      - name: configure update signing (optional)
        id: updater
        shell: bash
        env:
          S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${S_TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "Updates: TAURI_SIGNING_PRIVATE_KEY is not set; no update bundles, and this build never checks for updates."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$APP_VERSION" in *-alpha*) channel=alpha ;; *-beta*) channel=beta ;; *-*) channel=pre ;; *) channel=stable ;; esac
          CHANNEL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/updates-${channel}/latest.json" node -e '
            const fs = require("fs");
            const path = "apps/desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            const updater = conf.plugins && conf.plugins.updater;
            if (!updater || !updater.pubkey || updater.pubkey === "UPDATER_PUBLIC_KEY_NOT_SET") {
              console.error("TAURI_SIGNING_PRIVATE_KEY is set but tauri.conf.json has no updater pubkey. Put the public key there (docs/updates.md).");
              process.exit(1);
            }
            updater.endpoints = [process.env.CHANNEL_URL];
            conf.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          '
          echo "Updates: signing update bundles; the app reads updates-${channel}."
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: build installers
        working-directory: apps/desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
          fi
          npm run build -- "${args[@]}"
      # Gatekeeper on Apple silicon refuses a quarantined app with a missing
      # or broken nested signature as "damaged", with no prompt to open it
      # anyway. Fail the build if any part of the bundle misses the ad-hoc
      # (or, with secrets, Developer ID) signature, so a release never ships
      # that way by accident (#139 was reported as exactly that dialog).
      - name: verify the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          for app in src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
            echo "verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute "$app" 2>&1 \
              && echo "Gatekeeper accepts the app." \
              || echo "Gatekeeper refuses the unnotarized app; the release notes tell users the way past it."
          done
      # Refuse a sidecar that still loads Homebrew xz (or any other absolute
      # third-party dylib). That link is what made alpha builds abort with
      # "liblzma.5.dylib (no such file)" on machines without Homebrew xz.
      - name: refuse non-portable macOS dylibs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-macos-dylibs.py apps/desktop/src-tauri/binaries/ob-node-universal-apple-darwin
          for app in apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app; do
            python3 scripts/check-macos-dylibs.py "$app/Contents/MacOS/"*
          done
      # Arti defaults to OpenSSL; without rustls the Linux sidecar needs
      # libssl.so.3 and dies on minimal templates. Refuse that link.
      - name: refuse OpenSSL-linked Linux sidecars
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/check-linux-so.py apps/desktop/src-tauri/binaries/ob-node-*
      # The shell is static-CRT; the sidecar must be too, or clean Windows
      # installs fail on VCRUNTIME140.dll.
      - name: refuse MSVC-runtime Windows sidecars
        if: runner.os == 'Windows'
        shell: bash
        run: python3 scripts/check-pe-imports.py apps/desktop/src-tauri/binaries/ob-node-*.exe
      - name: collect installers
        shell: bash
        env:
          UPDATER: ${{ steps.updater.outputs.enabled }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # The universal sidecar is checked; its per-architecture halves are not
          # always runnable on this runner.
          for bin in apps/desktop/src-tauri/binaries/ob-node-*; do
            case "$bin" in *-aarch64-apple-darwin|*-x86_64-apple-darwin) [ "${{ matrix.target }}" = universal-apple-darwin ] && continue ;; esac
            reported="$("$bin" --version)"
            echo "$bin: $reported"
            case "$reported" in "ob-node ${APP_VERSION} ("*) ;; *) echo "$bin is not ${APP_VERSION}" >&2; exit 1 ;; esac
          done
          if [ -n "${{ matrix.target }}" ]; then
            bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          else
            bundle="apps/desktop/src-tauri/target/release/bundle"
          fi
          case "${RUNNER_OS}" in
            macOS)
              ditto -c -k --keepParent "$bundle"/macos/*.app "dist-release/OpenBazaar_${APP_VERSION}_universal.app.zip"
              cp "$bundle"/dmg/*.dmg dist-release/
              if [ "$UPDATER" = true ]; then
                cp "$bundle"/macos/OpenBazaar.app.tar.gz "dist-release/OpenBazaar_${APP_VERSION}_universal.app.tar.gz"
                cp "$bundle"/macos/OpenBazaar.app.tar.gz.sig "dist-release/OpenBazaar_${APP_VERSION}_universal.app.tar.gz.sig"
              fi
              ;;
            Linux)
              cp "$bundle"/deb/*.deb dist-release/
              cp "$bundle"/appimage/*.AppImage dist-release/
              if [ "$UPDATER" = true ]; then cp "$bundle"/appimage/*.AppImage.sig dist-release/; fi
              ;;
            Windows)
              cp "$bundle"/nsis/*.exe dist-release/
              if [ "$UPDATER" = true ]; then cp "$bundle"/nsis/*.exe.sig dist-release/; fi
              ;;
            *)
              echo "Unexpected runner ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          find dist-release -type f -print
          for file in dist-release/*; do
            case "$(basename "$file")" in *"_${APP_VERSION}_"*) ;; *) echo "$file does not carry ${APP_VERSION}" >&2; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist-release/
          if-no-files-found: error

  home-node:
    name: home node (${{ matrix.name }})
    needs: [verify, ui-gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OB_BUILD_KIND: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'release' || 'ci' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            docker-arch: amd64
            targets: ""
          - name: linux-arm64
            os: ubuntu-22.04-arm
            docker-arch: arm64
            targets: ""
          - name: macos-universal
            os: macos-latest
            docker-arch: ""
            targets: aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: home-node-${{ matrix.name }}
      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: npm ci
        working-directory: apps/mobile
      - name: set the version
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then dirty=true; else dirty=false; fi
          echo "OB_BUILD_DIRTY=${dirty}" >> "$GITHUB_ENV"
          node scripts/version.mjs set "$version"
          node scripts/version.mjs check
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
      - name: build ob-node and the web shop
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.targets }}" ]; then
            for target in ${{ matrix.targets }}; do cargo build --release --locked -p ob-node --target "$target"; done
            mkdir -p target/release
            lipo -create -output target/release/ob-node target/aarch64-apple-darwin/release/ob-node target/x86_64-apple-darwin/release/ob-node
          else
            cargo build --release --locked -p ob-node
          fi
          (cd apps/mobile && npm run build)
      - name: refuse non-portable macOS dylibs
        if: runner.os == 'macOS'
        shell: bash
        run: python3 scripts/check-macos-dylibs.py target/release/ob-node
      - name: refuse OpenSSL-linked Linux home nodes
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/check-linux-so.py target/release/ob-node
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          reported="$(target/release/ob-node --version)"
          echo "ob-node: $reported"
          case "$reported" in "ob-node ${APP_VERSION} ("*) ;; *) echo "ob-node is not ${APP_VERSION}" >&2; exit 1 ;; esac
          name="ob-node_${APP_VERSION}_${{ matrix.name }}"
          mkdir -p "package/$name" dist-release
          cp target/release/ob-node "package/$name/"
          cp -R apps/mobile/dist "package/$name/web"
          cp docs/home-node.md LICENSE "package/$name/"
          if [ "${RUNNER_OS}" = macOS ]; then
            cp packaging/macos/app.openbazaar.home-node.plist "package/$name/"
          else
            cp packaging/systemd/ob-node.service packaging/systemd/ob-node.env.example packaging/docker/compose.yml "package/$name/"
          fi
          tar -C package -czf "dist-release/$name.tar.gz" "$name"
          if [ -n "${{ matrix.docker-arch }}" ]; then
            mkdir -p "docker/linux-${{ matrix.docker-arch }}"
            cp target/release/ob-node "docker/linux-${{ matrix.docker-arch }}/"
            cp -R apps/mobile/dist docker/web
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: home-node-${{ matrix.name }}
          path: dist-release/
          if-no-files-found: error
      - if: matrix.docker-arch
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.name }}
          path: docker/
          if-no-files-found: error

  docker:
    name: home node image
    needs: home-node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          path: dist
          merge-multiple: true
      - name: image name and tags
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ob-node"
          echo "TAGS=${image}:${VERSION#v},${image}:latest" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
          tags: ${{ env.TAGS }}

  release:
    name: checksums and release
    needs: [desktop, home-node, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: home-node-*
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          path: repo
      # The update manifest the desktop app reads, when the desktop builds
      # signed their update bundles (docs/updates.md).
      - name: write the update manifest
        working-directory: release-assets
        run: |
          set -euo pipefail
          if ! ls ./*.sig >/dev/null 2>&1; then
            echo "No update signatures in this release; no manifest."
            exit 0
          fi
          python3 ../repo/scripts/update-manifest.py --version "${VERSION#v}" --repo "$GITHUB_REPOSITORY" --out latest.json .
          cat latest.json
      - name: write SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: openbazaar-installers
          path: release-assets/
          if-no-files-found: error
      - name: publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          tag="v${version}"
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          cat > release-notes.md <<EOF
          OpenBazaar ${version} desktop app. It runs on Bitcoin testnet4, not mainnet. Do not send real bitcoin.

          Download the file for your computer, install it, and open OpenBazaar. The app starts its own node and stops it when you quit. There is nothing else to run.

          - macOS (Apple silicon and Intel): the .dmg, or the zipped .app
          - Windows: the -setup.exe
          - Linux: the .AppImage, or the .deb for Debian and Ubuntu

          To run your store on an always-on computer and manage it from your phone or laptop over Tor, use the home node: the ob-node_*.tar.gz for Linux (x86_64, arm64) or macOS, or the Docker image ghcr.io/openbazaar/ob-node:${version}. home-node.md inside each archive explains setup and pairing.

          These builds are not signed with a developer certificate, so your system will warn you the first time.

          macOS: if the dialog says the app is damaged and offers no way to open it (usual on Apple silicon), the app is not damaged; macOS marks downloads it cannot verify that way. Open Terminal and run: xattr -cr /Applications/OpenBazaar.app - then open the app normally. If the dialog instead names an unidentified developer, open the app once, then go to System Settings > Privacy & Security and click Open Anyway, or right-click the app in Finder and choose Open, then Open again.

          Windows: when SmartScreen says it protected your PC, click More info, then Run anyway.

          Linux: make the AppImage executable (chmod +x) and run it.

          SHA256SUMS lists the checksum of every file.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "OpenBazaar ${version} (testnet4)" \
              --notes-file release-notes.md \
              "${flags[@]}"
          fi
          # Point the channel at this version only now that every file it
          # names is on the release.
          if [ -f release-assets/latest.json ]; then
            case "$version" in *-alpha*) channel=alpha ;; *-beta*) channel=beta ;; *-*) channel=pre ;; *) channel=stable ;; esac
            ctag="updates-${channel}"
            if ! gh release view "$ctag" >/dev/null 2>&1; then
              gh release create "$ctag" \
                --target "$GITHUB_SHA" \
                --prerelease \
                --title "Update manifest (${channel})" \
                --notes "The ${channel} channel's latest.json, which the desktop app reads to find new versions (docs/updates.md). Not an app release: download OpenBazaar from the versioned releases."
            fi
            gh release upload "$ctag" release-assets/latest.json --clobber
            echo "The ${channel} channel now offers ${version}."
          fi

