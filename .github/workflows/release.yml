name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: test before packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile

  desktop:
    name: tauri (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - run: npm ci
        working-directory: apps/mobile
      - run: npm ci
        working-directory: apps/desktop
      - name: set the installer version from the tag
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            console.error(`Tag ${process.env.GITHUB_REF_NAME} is not a semver version.`);
            process.exit(1);
          }
          const confPath = "apps/desktop/src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
          conf.version = version;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");
          const cargoPath = "apps/desktop/src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          const updated = cargo.replace(/^version = ".*"$/m, `version = "${version}"`);
          if (updated === cargo) {
            console.error("apps/desktop/src-tauri/Cargo.toml version was not updated.");
            process.exit(1);
          }
          fs.writeFileSync(cargoPath, updated);
          NODE
      - name: build installers
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run build -- --bundles ${{ matrix.bundles }}
      - name: collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          case "${RUNNER_OS}" in
            macOS)
              ditto -c -k --keepParent apps/desktop/src-tauri/target/release/bundle/macos/*.app dist-release/OpenBazaar-macos.app.zip
              cp apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg dist-release/
              ;;
            Linux)
              cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb dist-release/
              cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist-release/
              ;;
            Windows)
              cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist-release/
              ;;
            *)
              echo "Unexpected runner ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          find dist-release -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist-release/
          if-no-files-found: error

  publish:
    name: attach installers to the release
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release-assets -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "The tag build produced no installers." >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          Unsigned desktop installers for ${GITHUB_REF_NAME}.

          macOS is ad-hoc signed and not notarized. The disk image and the zipped app are built for the macOS runner architecture, which is Apple silicon on macos-latest. Windows has no Authenticode signature. Linux packages are unsigned. No Apple or Google credentials are stored in this repository.

          Android is not in this release. The repository has no Android package project. iOS is a paired client and is not built here. This workflow does not submit to the App Store or the Play Store.
          EOF
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "OpenBazaar ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

  # The Android package is not in this repository. There is no Gradle project
  # and no Expo prebuild, so a tag must not publish a placeholder APK.
  # android:
  #   name: android package
  #   needs: verify
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: echo "Android packaging is not set up."
