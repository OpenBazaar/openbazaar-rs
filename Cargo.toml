[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/node",
    "crates/pay",
    "crates/tormail",
    "crates/escrow",
    "crates/xmr",
    "crates/lightning",
    "crates/mobile-tor",
    "vendor/bip157",
]
exclude = ["vendor/ldk-node"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0-alpha.1"
publish = false

# The wallet lock runs Argon2id at 256 MiB; unoptimized that takes tens of seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Monero tests sign real CLSAG and Bulletproofs+ transactions.
[profile.dev.package.curve25519-dalek]
opt-level = 3

# ldk-node 0.7.1 pins rusqlite 0.31; Arti needs 0.36 or later. See vendor/ldk-node/Cargo.toml.
[patch.crates-io]
bip157 = { path = "vendor/bip157" }
ldk-node = { path = "vendor/ldk-node" }
