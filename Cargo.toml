[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/node",
    "crates/pay",
    "crates/tormail",
    "crates/escrow",
    "crates/xmr",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0-alpha.1"
publish = false

# The wallet lock runs Argon2id at 256 MiB; unoptimized that takes tens of seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Monero tests sign real CLSAG and Bulletproofs+ transactions.
[profile.dev.package.curve25519-dalek]
opt-level = 3
